name: CI

on:
  push:
    branches: [vibe/agodeo-web-printer-7ead01]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verification syntaxe JS + tests du protocole
        run: npm run ci
